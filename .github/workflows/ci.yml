name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: gavinhsmith/setup-ti84-ce-toolchain@v1.0.0
        with:
          version: v15.0

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: program
          path: bin/*.8xp

      - name: Test
        env:
          CE_ROM_BASE64: ${{ secrets.CE_ROM_BASE64 }}
        run: |
          if [ -z "$CE_ROM_BASE64" ]; then
            echo "::warning::CE_ROM_BASE64 secret not set; skipping autotests"
            exit 0
          fi
          echo "$CE_ROM_BASE64" | base64 -d > "$RUNNER_TEMP/ce.rom"
          AUTOTESTER_ROM="$RUNNER_TEMP/ce.rom" make test

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/*.8xp --generate-notes
