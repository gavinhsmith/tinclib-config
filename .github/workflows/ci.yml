name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Host unit tests (ASan + UBSan)
        run: make -C tests CC=gcc

  build:
    needs: host-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: gavinhsmith/setup-ti84-ce-toolchain@v1.0.0
        with:
          version: v15.0

      - name: Build
        run: |
          make
          make relaunch

      - uses: actions/upload-artifact@v4
        with:
          name: program
          path: bin/*.8xp

      - name: Test
        env:
          # Read-only token for the private repo holding the ROM (too big for a secret).
          CE_ROM_TOKEN: ${{ secrets.CE_ROM_TOKEN }}
        run: |
          if [ -z "$CE_ROM_TOKEN" ]; then
            echo "::warning::CE_ROM_TOKEN secret not set; skipping autotests"
            exit 0
          fi
          curl -fsSLo "$RUNNER_TEMP/ce.rom" \
            -H "Authorization: Bearer $CE_ROM_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            https://api.github.com/repos/gavinhsmith/ce-rom/contents/ti-84ce.rom
          # The ROM is arTIfiCE-jailbroken with clibs installed; autotest.py
          # launches through AsmHook2 since OS 5.5+ has no Asm(.
          AUTOTESTER_ROM="$RUNNER_TEMP/ce.rom" \
            python3 tests/autotest.py autotest.json tests/relaunch/autotest.json

      - name: Upload failing screens
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-screens
          path: tests/build/*/*.png

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/TINCLIBC.8xp --generate-notes
